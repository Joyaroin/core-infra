all:
  children:
    proxmox:                      # a group: your Proxmox host(s)
      hosts:
        joseph:                   # the name Ansible uses in its output
          ansible_host: joseph.tailf69bc5.ts.net   # how to actually reach it
          ansible_user: root

    runners:
      hosts:
        echoes:
          ansible_host: 192.168.2.15
          ansible_user: adham
          # Go through joseph, so this works at home and away.
          ansible_ssh_common_args: "-o ProxyJump=root@joseph.tailf69bc5.ts.net"

    dns:
      hosts:
        heavens-door:
          ansible_host: 192.168.2.13
          ansible_user: root
          ansible_ssh_common_args: "-o ProxyJump=root@joseph.tailf69bc5.ts.net"
          vm_id: 206 # the container's Proxmox ID, used from joseph

    k3s:
      hosts:
        hermit:
          # DHCP, but the MAC is fixed in Terraform, so the router hands out the same address.
          ansible_host: 192.168.2.211
          ansible_user: adham
          ansible_ssh_common_args: "-o ProxyJump=root@joseph.tailf69bc5.ts.net"
