all:
  children:
    proxmox:                      # a group: your Proxmox host(s)
      hosts:
        joseph:                   # the name Ansible uses in its output
          ansible_host: joseph.tailf69bc5.ts.net   # how to actually reach it
          ansible_user: root

    test:                         # a group: throwaway VMs
      hosts:
        tf-test:
          ansible_host: 192.168.2.50
          ansible_user: ubuntu
          # Go through joseph, the same as your "ssh -J". Works at home and away.
          ansible_ssh_common_args: "-o ProxyJump=root@joseph.tailf69bc5.ts.net"
