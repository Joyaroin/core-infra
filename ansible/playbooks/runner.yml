# Sets up echoes as a Forgejo Actions runner.
# Run with a Tailscale auth key (tag:ci) the first time:
#   ansible-playbook playbooks/runner.yml -e tailscale_authkey=tskey-...
- name: Forgejo Actions runner
  hosts: runners
  become: true

  vars:
    runner_version: "13.2.1"
    forgejo_url: https://git.tailf69bc5.ts.net
    # The image a job runs in when it names none, pinned by digest so every job, and a rebuilt echoes, gets the same one.
    # Renovate keeps the digest current (renovate.json). The labels go in config.yml too, which the daemon reads over the
    # ones saved at registration.
    runner_image: "node:22.23.5-bookworm@sha256:e13726ca604184d7a91fcacab1fc09eefd642dc28e79ac34e85540dd93b78cfb"
    runner_labels: "docker:docker://{{ runner_image }},ubuntu-latest:docker://{{ runner_image }}"
    runner_home: /var/lib/forgejo-runner
    # The firewall: the home network, and the few things on it the runner still needs.
    home_lan: 192.168.2.0/24
    home_router: 192.168.2.1   # also the runner's DNS server: cloud-init took it from the gateway
    proxmox_host: 192.168.2.10 # jotaro. Ansible reaches echoes by jumping through it.
    forgejo_lan: 192.168.2.14  # Tailscale's direct path to git runs over the LAN
    tailscale_port: "41641"
    docker_nets: 172.16.0.0/12 # Docker's own networks, where the job containers live

  tasks:
    - name: Install the guest agent, Docker and the firewall
      ansible.builtin.apt:
        name:
          - qemu-guest-agent
          - docker.io
          - ufw
          - acl # lets Ansible run tasks as the forgejo-runner user
        update_cache: true

    - name: Start the guest agent
      ansible.builtin.service:
        name: qemu-guest-agent
        state: started

    # A safety net, not a speed-up: echoes has had no OOM kill and almost no memory stall, but a release job runs
    # Chromium next to an npm build in 9 GB with no swap at all. A small swap file takes a spike instead of the OOM
    # killer, and swappiness 10 keeps the kernel off it otherwise. (zram needs linux-modules-extra, which this cloud kernel lacks.)
    # Each step checks the state, not whether the file was just made, so a run cut off half way is repaired by the next,
    # and the checks report a change in --check, so the drift check sees swap that is off.
    - name: Make a 2 GB swap file
      ansible.builtin.shell: umask 077 && fallocate -l 2G /swapfile
      args:
        creates: /swapfile

    - name: Check the swap file is formatted as swap
      ansible.builtin.command: blkid -o value -s TYPE /swapfile
      register: swap_type
      changed_when: swap_type.stdout != "swap"
      failed_when: false
      check_mode: false

    - name: Format the swap file
      ansible.builtin.command: mkswap /swapfile
      when: swap_type.stdout != "swap"

    - name: Check the swap file is on
      ansible.builtin.command: swapon --show=NAME --noheadings
      register: swaps
      changed_when: "'/swapfile' not in swaps.stdout_lines"
      check_mode: false

    - name: Turn the swap file on
      ansible.builtin.command: swapon /swapfile
      when: "'/swapfile' not in swaps.stdout_lines"

    - name: Turn the swap file on at boot
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: /swapfile none swap sw 0 0

    # Compares the live value too, so a value written but not applied shows as drift.
    - name: Swap only under real memory pressure
      ansible.posix.sysctl:
        name: vm.swappiness
        value: "10"
        sysctl_file: /etc/sysctl.d/90-runner.conf

    # Housekeeping, not speed: job containers are removed when their job ends, and their logs with them. The storage
    # driver is left alone: Docker 29 already uses the containerd image store (overlayfs), and moving to the older
    # overlay2 driver would hide every image already pulled. Changing this file restarts Docker, which kills running jobs.
    - name: Rotate container logs
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        mode: "0644"
        content: |
          {
            "log-driver": "json-file",
            "log-opts": { "max-size": "10m", "max-file": "3" }
          }
      notify: Restart Docker

    # Restart now, not at the end of the play: if a later task failed, the new file would sit unapplied and no later
    # run would notice, since the file would already match.
    - name: Apply the Docker settings
      ansible.builtin.meta: flush_handlers

    # Old CI images are tagged, so the prune below keeps them: each changed ci/Dockerfile leaves a few GB behind. This keeps
    # the 2 newest of each CI image repository and removes the rest; the weekly prune runs it.
    - name: Install the CI image cleanup
      ansible.builtin.copy:
        dest: /usr/local/bin/prune-ci-images
        mode: "0755"
        # raw: the script's docker format string ({{.Repository}}) isn't an Ansible template.
        content: |
          {% raw %}#!/bin/sh
          # Removes old CI images from this runner's disk. For each CI image repository from the Forgejo registry
          # (git.tailf69bc5.ts.net/<owner>/<name>-ci), keeps the 2 newest by creation time and removes the rest. Docker
          # refuses to remove an image a container is using, so a running job keeps its image.
          set -u
          docker image ls --format '{{.Repository}} {{.Tag}} {{.CreatedAt}}' \
            | awk '$1 ~ /^git\.tailf69bc5\.ts\.net\/[^\/]+\/[^\/]+-ci$/ && $2 != "<none>"' \
            | sort -k1,1 -k3,4r \
            | awk '{ n[$1]++; if (n[$1] > 2) print $1 ":" $2 }' \
            | xargs -r docker image rm || true
          {% endraw %}

    # Once a week, clears what jobs leave behind: stopped containers, unused networks, untagged images and build cache
    # older than a week. Not tagged images (no --all), so the job images stay pulled and no job waits on a 3 GB pull.
    # Then old CI images (prune-ci-images, above).
    - name: Install the weekly Docker prune
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.name }}"
        mode: "0644"
        content: "{{ item.content }}"
      loop:
        - name: docker-prune.service
          content: |
            [Unit]
            Description=Prune unused Docker data
            Requires=docker.service
            After=docker.service

            [Service]
            Type=oneshot
            ExecStart=/usr/bin/docker system prune --force --filter until=168h
            ExecStart=/usr/local/bin/prune-ci-images
        - name: docker-prune.timer
          content: |
            [Unit]
            Description=Prune unused Docker data weekly

            [Timer]
            OnCalendar=weekly
            RandomizedDelaySec=1h
            Persistent=true

            [Install]
            WantedBy=timers.target
      loop_control:
        label: "{{ item.name }}"

    - name: Start the weekly Docker prune
      ansible.builtin.systemd_service:
        name: docker-prune.timer
        state: started
        enabled: true
        daemon_reload: true

    - name: Install Tailscale
      ansible.builtin.shell: curl -fsSL https://tailscale.com/install.sh | sh
      args:
        creates: /usr/bin/tailscale

    - name: Check whether Tailscale is logged in
      ansible.builtin.command: tailscale status
      register: tailscale_status
      changed_when: false
      failed_when: false
      check_mode: false # run even in --check, so drift checks see it

    - name: Join the tailnet
      # accept-dns=false: echoes uses its own DNS, not the tailnet's.
      ansible.builtin.command: tailscale up --authkey={{ tailscale_authkey }} --hostname=echoes --accept-dns=false
      when: tailscale_status.rc != 0
      no_log: true

    # Without Tailscale DNS, point the git hostname at forgejo's Tailscale IP.
    # The template is what cloud-init rebuilds /etc/hosts from on every boot.
    - name: Make git.tailf69bc5.ts.net resolve
      ansible.builtin.lineinfile:
        path: "{{ item }}"
        line: "100.95.34.20 git.tailf69bc5.ts.net"
      loop:
        - /etc/hosts
        - /etc/cloud/templates/hosts.debian.tmpl

    - name: Create the runner user
      ansible.builtin.user:
        name: forgejo-runner
        system: true
        home: "{{ runner_home }}"
        groups: docker
        append: true

    - name: Download the runner
      ansible.builtin.get_url:
        url: "https://code.forgejo.org/forgejo/runner/releases/download/v{{ runner_version }}/forgejo-runner-{{ runner_version }}-linux-amd64"
        dest: /usr/local/bin/forgejo-runner
        mode: "0755"

    - name: Write the runner config
      ansible.builtin.copy:
        dest: "{{ runner_home }}/config.yml"
        owner: forgejo-runner
        group: forgejo-runner
        mode: "0640"
        content: |
          runner:
            file: .runner
            capacity: 3
            timeout: 3h
            labels: ["docker:docker://{{ runner_image }}", "ubuntu-latest:docker://{{ runner_image }}"]
          container:
            # Job containers can't use Tailscale's DNS, so point them at forgejo directly.
            options: "--add-host=git.tailf69bc5.ts.net:100.95.34.20"
            docker_host: "-"
      # The daemon reads its config only at start. Restarting it kills a running job, so apply when CI is quiet.
      notify: Restart the runner

    - name: Check whether the runner is registered
      ansible.builtin.stat:
        path: "{{ runner_home }}/.runner"
      register: runner_file

    - name: Get a registration token from forgejo
      ansible.builtin.command: >-
        pct exec 203 -- su git -s /bin/sh -c
        "/usr/local/bin/forgejo forgejo-cli actions generate-runner-token --config /etc/forgejo/app.ini"
      delegate_to: joseph
      become: false # already root there, and Proxmox has no sudo
      register: runner_token
      when: not runner_file.stat.exists
      no_log: true

    - name: Register the runner
      ansible.builtin.command: >-
        forgejo-runner register --no-interactive
        --instance {{ forgejo_url }}
        --token {{ runner_token.stdout }}
        --name echoes
        --labels {{ runner_labels }}
      args:
        chdir: "{{ runner_home }}"
      become_user: forgejo-runner
      when: not runner_file.stat.exists
      no_log: true

    - name: Install the runner service
      ansible.builtin.copy:
        dest: /etc/systemd/system/forgejo-runner.service
        mode: "0644"
        content: |
          [Unit]
          Description=Forgejo Runner
          After=docker.service network-online.target
          Wants=docker.service network-online.target

          [Service]
          User=forgejo-runner
          Group=forgejo-runner
          WorkingDirectory={{ runner_home }}
          ExecStart=/usr/local/bin/forgejo-runner daemon --config {{ runner_home }}/config.yml
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target

    - name: Start the runner
      ansible.builtin.systemd_service:
        name: forgejo-runner
        state: started
        enabled: true
        daemon_reload: true

    # The runner runs whatever a CI job says, so it is cut off from the home
    # network in both directions. It keeps the internet, DNS on the router, and
    # the tailnet, where the access rules let it reach only git on 443.
    # If a rule ever locks Ansible out, switch the firewall off from jotaro:
    #   qm guest exec 205 -- ufw disable
    - name: Firewall defaults
      community.general.ufw:
        default: "{{ item.policy }}"
        direction: "{{ item.direction }}"
      loop:
        - { direction: incoming, policy: deny }
        - { direction: outgoing, policy: allow }

    - name: Firewall rules, incoming
      community.general.ufw:
        rule: allow
        from_ip: "{{ item.from }}"
        port: "{{ item.port | default(omit) }}"
        proto: "{{ item.proto | default('any') }}"
        comment: "{{ item.comment }}"
      loop:
        - { from: "{{ proxmox_host }}", port: "22", proto: tcp, comment: SSH from jotaro (Ansible) }
        # The runner's cache server listens on a new port at each start.
        - { from: "{{ docker_nets }}", comment: Job containers to the cache server }

    # Order matters: ufw takes the first rule that matches, so the two
    # exceptions come before the rule that rejects the rest of the home network.
    # A rule added after the reject does nothing; delete and re-add in order.
    - name: Firewall rules, outgoing
      community.general.ufw:
        rule: "{{ item.rule }}"
        direction: out
        to_ip: "{{ item.to }}"
        port: "{{ item.port | default(omit) }}"
        proto: "{{ item.proto | default('any') }}"
        comment: "{{ item.comment }}"
      loop:
        - { rule: allow, to: "{{ home_router }}", port: "53", proto: udp, comment: DNS on the router }
        - { rule: allow, to: "{{ home_router }}", port: "53", proto: tcp, comment: DNS on the router }
        # Only the encrypted tunnel. Without it every clone and image push is relayed over the internet.
        - { rule: allow, to: "{{ forgejo_lan }}", port: "{{ tailscale_port }}", proto: udp, comment: Tailscale direct path to git }
        - { rule: reject, to: "{{ home_lan }}", comment: Nothing else on the home network }
        - { rule: reject, to: "fe80::/10", comment: Nor over IPv6 link-local }

    # Docker forwards its containers' traffic past ufw's own rules, so the job
    # containers get the same block in the chain Docker leaves for this. ufw
    # loads the file on start and reload; naming the chain empties it first, so
    # a reload doesn't stack copies.
    - name: Keep job containers off the home network
      ansible.builtin.blockinfile:
        path: /etc/ufw/after.rules
        marker: "# {mark} runner: job containers and the home network (Ansible)"
        block: |
          *filter
          :DOCKER-USER - [0:0]
          -A DOCKER-USER -m conntrack --ctstate RELATED,ESTABLISHED -j RETURN
          -A DOCKER-USER -d {{ home_router }}/32 -p udp -m udp --dport 53 -j RETURN
          -A DOCKER-USER -d {{ home_router }}/32 -p tcp -m tcp --dport 53 -j RETURN
          -A DOCKER-USER -d {{ home_lan }} -j REJECT --reject-with icmp-port-unreachable
          -A DOCKER-USER -j RETURN
          COMMIT
      notify: Reload the firewall

    - name: Turn the firewall on
      community.general.ufw:
        state: enabled

  handlers:
    - name: Reload the firewall
      community.general.ufw:
        state: reloaded

    - name: Restart Docker
      ansible.builtin.systemd_service:
        name: docker
        state: restarted

    - name: Restart the runner
      ansible.builtin.systemd_service:
        name: forgejo-runner
        state: restarted
