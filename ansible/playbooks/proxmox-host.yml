- name: Proxmox host setup
  hosts: proxmox

  vars:
    terraform_role: TerraformProv
    terraform_user: terraform@pve
    terraform_privs:
      - Datastore.Allocate
      - Datastore.AllocateSpace
      - Datastore.AllocateTemplate
      - Datastore.Audit
      - Pool.Allocate
      - Pool.Audit
      - SDN.Use
      - Sys.Audit
      - Sys.Console
      - Sys.Modify
      - VM.Allocate
      - VM.Audit
      - VM.Clone
      - VM.Config.CDROM
      - VM.Config.CPU
      - VM.Config.Cloudinit
      - VM.Config.Disk
      - VM.Config.HWType
      - VM.Config.Memory
      - VM.Config.Network
      - VM.Config.Options
      - VM.GuestAgent.Audit # lets Terraform read IPs from the guest agent
      - VM.Migrate
      - VM.PowerMgmt
    local_storage_content:
      - backup
      - import
      - iso
      - vztmpl
    postfix_relay:
      relayhost: "[smtp.gmail.com]:465"
      smtp_tls_wrappermode: "yes" # port 465 is TLS from the first byte
      smtp_tls_security_level: encrypt
      smtp_sasl_auth_enable: "yes"
      smtp_sasl_password_maps: hash:/etc/postfix/sasl_passwd
      smtp_sasl_security_options: noanonymous
      inet_protocols: ipv4 # joseph has no IPv6 route

  tasks:
    - name: Read current roles, users, permissions and storage
      ansible.builtin.command: "pvesh get {{ item }} --output-format json"
      loop:
        - /access/roles
        - /access/users
        - /access/acl
        - /storage/local
      register: pve_reads
      changed_when: false
      check_mode: false

    - name: Turn the raw output into variables
      ansible.builtin.set_fact:
        local_disabled: "{{ (pve_reads.results[3].stdout | from_json).disable | default(0) | int == 1 }}"
        current_role: "{{ pve_reads.results[0].stdout | from_json | selectattr('roleid', 'equalto', terraform_role) | first | default(None) }}"
        user_exists: "{{ pve_reads.results[1].stdout | from_json | selectattr('userid', 'equalto', terraform_user) | list | length > 0 }}"
        acl_exists: "{{ pve_reads.results[2].stdout | from_json | selectattr('ugid', 'equalto', terraform_user) | selectattr('path', 'equalto', '/') | selectattr('roleid', 'equalto', terraform_role) | list | length > 0 }}"
        current_content: "{{ (pve_reads.results[3].stdout | from_json).content.split(',') }}"

    - name: Create the Terraform role
      ansible.builtin.command: pveum role add {{ terraform_role }} -privs "{{ terraform_privs | join(' ') }}"
      when: current_role is none

    - name: Fix the Terraform role's privileges if they differ
      ansible.builtin.command: pveum role modify {{ terraform_role }} -privs "{{ terraform_privs | join(' ') }}"
      when:
        - current_role is not none
        - current_role.privs.split(',') | symmetric_difference(terraform_privs) | length > 0

    - name: Create the Terraform user
      ansible.builtin.command: pveum user add {{ terraform_user }}
      when: not user_exists

    - name: Give the Terraform user its role on everything
      ansible.builtin.command: pveum aclmod / -user {{ terraform_user }} -role {{ terraform_role }}
      when: not acl_exists

    - name: Allow import images on the local storage
      ansible.builtin.command: pvesm set local --content {{ local_storage_content | join(',') }}
      when: current_content | symmetric_difference(local_storage_content) | length > 0

    - name: Make sure the local storage is enabled
      ansible.builtin.command: pvesm set local --disable 0
      when: local_disabled

    # Debian security fixes install themselves daily. Proxmox's own packages
    # (including the kernel) are left for a deliberate `apt dist-upgrade`, and
    # nothing reboots on its own: a reboot restarts every guest and seals Vault.
    - name: Install unattended-upgrades
      ansible.builtin.apt:
        name: unattended-upgrades

    - name: Install security updates daily, never reboot
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
          Unattended-Upgrade::Automatic-Reboot "false";

    # Debian's default also takes stable point releases. Narrow it to security
    # fixes. Named 52 so it's read after Debian's 50unattended-upgrades.
    - name: Only take Debian security fixes
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/52security-only
        mode: "0644"
        content: |
          #clear Unattended-Upgrade::Origins-Pattern;
          Unattended-Upgrade::Origins-Pattern {
            "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
          };

    # Notifications (backup results, available updates) are emailed to
    # root@pam's address. The home connection blocks sending mail directly
    # (port 25), so postfix relays it through Gmail on port 465 with an app
    # password. (Proxmox's own SMTP target fails against Gmail on 9.2.)
    # The first run needs the app password, typed without its spaces
    # (Ansible cuts -e values at a space): -e gmail_app_password=abcdefghijklmnop
    - name: Install SASL support for postfix
      ansible.builtin.apt:
        name: libsasl2-modules

    - name: Relay mail through Gmail
      ansible.builtin.lineinfile:
        path: /etc/postfix/main.cf
        regexp: "^{{ item.key }}\\s*="
        line: "{{ item.key }} = {{ item.value }}"
      loop: "{{ postfix_relay | dict2items }}"
      notify: Restart postfix

    - name: Read root@pam's email
      ansible.builtin.command: pvesh get /access/users/root@pam --output-format json
      register: root_user
      changed_when: false
      check_mode: false

    - name: Check whether the Gmail login exists
      ansible.builtin.stat:
        path: /etc/postfix/sasl_passwd
      register: sasl_passwd

    - name: Write the Gmail login
      ansible.builtin.copy:
        dest: /etc/postfix/sasl_passwd
        mode: "0600"
        content: "[smtp.gmail.com]:465 {{ (root_user.stdout | from_json).email }}:{{ gmail_app_password | replace(' ', '') }}\n"
      when: not sasl_passwd.stat.exists
      no_log: true
      notify: Build the Gmail login map

    # Without a subscription, Proxmox's default ("auto") never sends the
    # "updates available" email. "always" sends it whenever new updates appear.
    - name: Read the datacenter options
      ansible.builtin.command: pvesh get /cluster/options --output-format json
      register: dc_options
      changed_when: false
      check_mode: false

    - name: Always email about available updates
      ansible.builtin.command: pvesh set /cluster/options --notify package-updates=always
      when: "(dc_options.stdout | from_json).notify | default({}) != {'package-updates': 'always'}"

    # The "updates available" email ends with the steps to take. Proxmox reads
    # overrides of its email templates from here (no mode: /etc/pve sets its own).
    - name: Create the notification template folder
      ansible.builtin.file:
        path: /etc/pve/notification-templates/default
        state: directory

    # Ansible can't create files in /etc/pve (it refuses the permission change
    # that comes with a new file), but it can fill in existing ones.
    - name: Create the template files empty
      ansible.builtin.command: touch /etc/pve/notification-templates/default/{{ item }}
      args:
        creates: /etc/pve/notification-templates/default/{{ item }}
      loop:
        - package-updates-body.txt.hbs
        - package-updates-body.html.hbs

    - name: Add the update steps to the update email
      ansible.builtin.copy:
        src: notification-templates/{{ item }}
        dest: /etc/pve/notification-templates/default/{{ item }}
        unsafe_writes: true # /etc/pve refuses the temp file swap copy normally does
      loop:
        - package-updates-body.txt.hbs
        - package-updates-body.html.hbs

  handlers:
    - name: Build the Gmail login map
      ansible.builtin.command: postmap /etc/postfix/sasl_passwd

    - name: Restart postfix
      ansible.builtin.service:
        name: postfix
        state: restarted
